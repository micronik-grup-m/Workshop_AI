name: Java CI (Nexus + Sonar + Dependency-Track + Docker)

on:
  workflow_call:
    inputs:
      java-version: { type: string,  default: '21' }
      deploy-maven: { type: boolean, default: false }
      push-image:   { type: boolean, default: false }
      image-name:   { type: string,  default: '' }
    secrets:
      NEXUS_USER:     { required: true }
      NEXUS_PASSWORD: { required: true }
      SONAR_TOKEN:    { required: true }
      DTRACK_APIKEY:  { required: true }
      NVD_API_KEY:    { required: true }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Sonar are nevoie de istoric, altfel pierde "blame"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven            # cache-ul Maven al GitHub-ului, nu al tau
          server-id: nexus        # genereaza ~/.m2/settings.xml cu credentialele de mai jos
          server-username: NEXUS_USER
          server-password: NEXUS_PASSWORD

      - name: Mirror Nexus pentru dependinte (in loc de Maven Central direct)
        run: |
          python3 - <<'PY'
          import os

          path = os.path.expanduser("~/.m2/settings.xml")
          with open(path) as f:
              content = f.read()

          mirror = """  <mirrors>
              <mirror>
                <id>nexus</id>
                <mirrorOf>*</mirrorOf>
                <url>https://nexus.georgesand.ro/repository/maven-public/</url>
              </mirror>
            </mirrors>
          """

          content = content.replace("</settings>", mirror + "</settings>")
          with open(path, "w") as f:
              f.write(content)
          PY

      - name: Build si teste
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B clean verify -DnvdApiKey="$NVD_API_KEY"

      - name: Analiza SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B sonar:sonar
          -Dsonar.host.url=https://sonar.georgesand.ro
          -Dsonar.projectKey=${{ github.event.repository.name }}
          -Dsonar.projectName=${{ github.event.repository.name }}

      - name: SBOM si trimitere in Dependency-Track
        env:
          DTRACK_APIKEY: ${{ secrets.DTRACK_APIKEY }}
        run: |
          mvn -B cyclonedx:makeAggregateBom
          mvn -B io.github.pmckeown:dependency-track-maven-plugin:upload-bom \
            -Ddependency-track.serverUrl=https://dtrack.georgesand.ro \
            -Ddependency-track.apiKey="$DTRACK_APIKEY" \
            -Ddependency-track.projectName=${{ github.event.repository.name }} \
            -Ddependency-track.projectVersion=${{ github.ref_name }}

      - name: Publicare artefact in Nexus
        if: ${{ inputs.deploy-maven }}
        env:
          NEXUS_USER:     ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: mvn -B deploy -DskipTests

      - name: Login la registry-ul tau
        if: ${{ inputs.push-image }}
        uses: docker/login-action@v3
        with:
          registry: docker.georgesand.ro
          username: ${{ secrets.NEXUS_USER }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Build si push imagine
        if: ${{ inputs.push-image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            docker.georgesand.ro/${{ inputs.image-name }}:${{ github.sha }}
            docker.georgesand.ro/${{ inputs.image-name }}:latest
