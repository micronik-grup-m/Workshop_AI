name: Frontend CI (Angular + Docker)

on:
  workflow_call:
    inputs:
      node-version: { type: string,  default: '22' }
      push-image:   { type: boolean, default: false }
      image-name:   { type: string,  default: '' }
    secrets:
      NEXUS_USER:     { required: true }
      NEXUS_PASSWORD: { required: true }

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalare dependinte
        run: npm ci

      - name: Teste (o singura rulare, fara watch)
        run: npx ng test --no-watch

      - name: Build productie
        run: npx ng build

      - name: Login la registry-ul tau
        if: ${{ inputs.push-image }}
        uses: docker/login-action@v4
        with:
          registry: docker.georgesand.ro
          username: ${{ secrets.NEXUS_USER }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Build si push imagine
        if: ${{ inputs.push-image }}
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: true
          tags: |
            docker.georgesand.ro/${{ inputs.image-name }}:${{ github.sha }}
            docker.georgesand.ro/${{ inputs.image-name }}:latest
