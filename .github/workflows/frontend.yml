name: Frontend
on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
      - '.github/workflows/frontend-ci.yml'

jobs:
  frontend:
    uses: micronik-grup-m/Workshop_AI/.github/workflows/frontend-ci.yml@main
    with:
      push-image: true
      image-name: frontend
    secrets: inherit        # trimite automat toate secretele, nu le enumeri
