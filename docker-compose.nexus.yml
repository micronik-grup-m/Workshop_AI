services:
  nexus:
    image: sonatype/nexus3:3.96.0
    ports:
      - "8081:8081"
    environment:
      - INSTALL4J_ADD_VM_PARAMS=-Xms1200m -Xmx1200m -XX:MaxDirectMemorySize=2g
    volumes:
      - nexus-data:/nexus-data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/service/rest/v1/status | grep -q '.'"]
      interval: 15s
      timeout: 5s
      retries: 30

volumes:
  nexus-data:
